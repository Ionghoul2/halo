<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="Arial, sans-serif" font-size="14">
<rect width="900" height="260" fill="#fff"/>
<text x="20" y="30" font-size="18" font-weight="bold">Three tiers, what the controller can actually do</text>
<g stroke="#222" fill="#f4f4f4"><rect x="20" y="60" width="270" height="170" rx="8"/><rect x="315" y="60" width="270" height="170" rx="8"/><rect x="610" y="60" width="270" height="170" rx="8"/></g>
<text x="35" y="88" font-weight="bold">Classic — fairy string</text>
<text x="35" y="112">Mode box: 8 fixed modes</text><text x="35" y="134">All LEDs change together</text><text x="35" y="156">No app, no graphics</text><text x="35" y="178">~$30 / 1,000 LEDs</text>
<text x="330" y="88" font-weight="bold">RGB — WS2811 + app box</text>
<text x="330" y="112">Each pixel addressable</text><text x="330" y="134">Preset effects / music</text><text x="330" y="156">No position map: no logos</text><text x="330" y="178">~$80 / 1,000 px</text>
<text x="625" y="88" font-weight="bold">Graphic — mapped pixels</text>
<text x="625" y="112">Twinkly: camera mapping</text><text x="625" y="134">WLED: manual ledmap.json</text><text x="625" y="156">Logos, text, GIF upload</text><text x="625" y="178">Same pixels as RGB (WLED)</text>
<text x="35" y="215" font-size="12">Same string ≠ same result:</text><text x="330" y="215" font-size="12">addressable ≠ mapped</text><text x="625" y="215" font-size="12">mapping = software + layout</text>
</svg>
